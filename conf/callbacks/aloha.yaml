ema:
  _target_: mode.callbacks.ema.EMA
  decay: 0.999
  start_step: 0
  save_ema_weights_in_callback_state: True
  evaluate_ema_weights_instead: True

  power: 0.6666666666666666
  inv_gamma: 1.0
  min_value: 0.0
  max_value: 0.9999

checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  save_top_k: 5
  verbose: True
#  monitor: val_act/lang_trajr_loss_pp
#  mode: min
#  every_n_epochs: ${callbacks.rollout_lh.rollout_freq}
#  filename: '{epoch:02d}_{val_loss:.2f}' #put back in when PL fixes this _{val/accuracy:.4f}'
  monitor: eval_success_rate
  mode: max
  dirpath: saved_models
  filename: '{epoch:02d}_{eval_success_rate:.2f}'
  every_n_epochs: ${callbacks.rollout_lh.rollout_freq}
  save_last: true

#'val_act/lang_act_loss_pp', 'val_act/lang_trajr_loss_pp'


rollout_lh:
  _target_: mode.rollout.rollout_aloha.RolloutAloha
  _recursive_: false
  env_cfg:
    id: "gym_aloha/AlohaTransferCube-v0"
    obs_type: "pixels_agent_pos"
    max_episode_steps: ${callbacks.rollout_lh.max_steps}
  lang_text: 'Pick up the cube with the right arm and transfer it to the left arm.'

  skip_epochs: ${rollout_lh_skip_epochs}
  rollout_freq: 50
  num_videos: 0
  max_steps: 500
  empty_cache: false
  debug: false
  n_eval: 10
  num_procs: 12
  use_mp: false



